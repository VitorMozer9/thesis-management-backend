<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | UFVJM TCCs</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>
  <header class="site-header"><div class="header-content header-login">
    <a class="brand" href="publicados.html"><img src="assets/logo-ufvjm-tccs.png" alt="UFVJM TCCs"></a>
  </div></header>
  <main class="login-main">
    <section class="login-panel" aria-labelledby="login-heading">
      <img class="login-brand" src="assets/logo-ufvjm-tccs.png" alt="UFVJM TCCs">
      <h1 id="login-heading" class="sr-only">Login institucional</h1>
      <p id="feedback" class="notice" role="status" aria-live="polite" hidden></p>
      <form id="login-form" method="post">
        <label for="email">E-mail</label>
        <div class="email-group"><input id="email" name="email" type="email" autocomplete="username" required></div>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn-lime login-submit" type="submit">Entrar</button>
      </form>
      <a href="publicados.html" class="login-alt">Explorar o repositório →</a>
    </section>
  </main>
</body>
</html>
