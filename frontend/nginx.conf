map $uri $academic_upstream {
    default "";
    ~^/api/(auth|users)/ identity-api:8000;
    ~^/api/theses/ thesis-api:8000;
    ~^/api/defenses/ defense-api:8000;
    ~^/api/repository/ repository-api:8000;
    ~^/api/notifications/ notification-api:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=15s ipv6=off;
    client_max_body_size 21m;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        if ($academic_upstream = "") { return 404; }
        proxy_pass http://$academic_upstream;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_hide_header Location;
        proxy_redirect off;
    }

    location /internal/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
