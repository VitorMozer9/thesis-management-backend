x-thesis: &thesis
  image: thesis-service:local
  pull_policy: never
  init: true
  restart: "on-failure:3"
  environment: &thesis-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY}
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,thesis-api}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    REDIS_TEST_URL: redis://redis:6379/15
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_THESIS_EVENTS_TOPIC: ${KAFKA_THESIS_EVENTS_TOPIC:-thesis.events.v1}
    KAFKA_PDF_GROUP_ID: ${KAFKA_PDF_GROUP_ID:-thesis-pdf-extraction-v1}
    MEDIA_ROOT: /var/lib/thesis/media

services:

  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres18_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs



  thesis-migrate:
    <<: *thesis
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy

  thesis-topic:
    image: apache/kafka:4.4.0
    restart: "on-failure:3"
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:19092", "--create", "--if-not-exists", "--topic", "${KAFKA_THESIS_EVENTS_TOPIC:-thesis.events.v1}", "--partitions", "1", "--replication-factor", "1"]
    depends_on:
      kafka:
        condition: service_started

  thesis-api:
    <<: *thesis
    build: ../services/thesis-service
    environment:
      <<: *thesis-env
      THESIS_JWT_ISSUER: ${THESIS_JWT_ISSUER:-}
      THESIS_JWT_AUDIENCE: ${THESIS_JWT_AUDIENCE:-}
      THESIS_JWT_PUBLIC_KEY: ${THESIS_JWT_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:${THESIS_API_PORT:-8001}:8000"
    volumes:
      - thesis_media:/var/lib/thesis/media
    depends_on:
      thesis-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/api/theses/'); raise SystemExit(c.getresponse().status != 401)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  thesis-outbox-worker:
    <<: *thesis
    command: ["python", "manage.py", "run_outbox_worker"]
    depends_on: &worker-deps
      thesis-migrate:
        condition: service_completed_successfully
      thesis-topic:
        condition: service_completed_successfully

  thesis-pdf-worker:
    <<: *thesis
    command: ["python", "manage.py", "run_pdf_worker"]
    stop_grace_period: 60s
    volumes:
      - thesis_media:/var/lib/thesis/media:ro
    depends_on: *worker-deps

volumes:
  postgres_data:
  postgres18_data:
  redis_data:
  kafka_data:
  thesis_media:
